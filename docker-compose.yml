services:
  postgres:
    profiles: ["full-stack"]
    image: postgres:16
    container_name: optiflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_CONTAINER_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  crm-service:
    build:
      context: .
      dockerfile: tools/crm-service/Dockerfile
    container_name: optiflow-crm
    environment:
      SERVICE_NAME: crm-service
      SERVICE_PORT: ${CRM_SERVICE_CONTAINER_PORT}
      ENVIRONMENT: ${APP_ENV}
      DATABASE_URL: ${CRM_DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      TOOL_SHARED_TOKEN: ${TOOL_SHARED_TOKEN}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      SCENARIO_ID: ${SCENARIO_ID}
      ENABLE_SEED_DATA: ${ENABLE_SEED_DATA}
      REQUEST_ID_HEADER: ${REQUEST_ID_HEADER}
      MAX_REQUEST_ID_LENGTH: ${MAX_REQUEST_ID_LENGTH}
      MAX_PAGE_SIZE: ${MAX_PAGE_SIZE}
    ports:
      - "${CRM_SERVICE_PORT}:${CRM_SERVICE_CONTAINER_PORT}"
    volumes:
      - crm_data:/app/data
      - ./scenarios:/app/scenarios:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${SERVICE_PORT}/readiness"]
      interval: 5s
      timeout: 3s
      retries: 10

  incident-service:
    build:
      context: .
      dockerfile: tools/incident-service/Dockerfile
    container_name: optiflow-incident
    environment:
      SERVICE_NAME: incident-service
      SERVICE_PORT: ${INCIDENT_SERVICE_CONTAINER_PORT}
      ENVIRONMENT: ${APP_ENV}
      DATABASE_URL: ${INCIDENT_DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      TOOL_SHARED_TOKEN: ${TOOL_SHARED_TOKEN}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      SCENARIO_ID: ${SCENARIO_ID}
      ENABLE_SEED_DATA: ${ENABLE_SEED_DATA}
      REQUEST_ID_HEADER: ${REQUEST_ID_HEADER}
      MAX_REQUEST_ID_LENGTH: ${MAX_REQUEST_ID_LENGTH}
      MAX_PAGE_SIZE: ${MAX_PAGE_SIZE}
      CRM_SERVICE_URL: ${CRM_SERVICE_URL}
      WORKFORCE_SERVICE_URL: ${WORKFORCE_SERVICE_URL}
    ports:
      - "${INCIDENT_SERVICE_PORT}:${INCIDENT_SERVICE_CONTAINER_PORT}"
    volumes:
      - incident_data:/app/data
      - ./scenarios:/app/scenarios:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${SERVICE_PORT}/readiness"]
      interval: 5s
      timeout: 3s
      retries: 10

  workforce-service:
    build:
      context: .
      dockerfile: tools/workforce-service/Dockerfile
    container_name: optiflow-workforce
    environment:
      SERVICE_NAME: workforce-service
      SERVICE_PORT: ${WORKFORCE_SERVICE_CONTAINER_PORT}
      ENVIRONMENT: ${APP_ENV}
      DATABASE_URL: ${WORKFORCE_DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      TOOL_SHARED_TOKEN: ${TOOL_SHARED_TOKEN}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      SCENARIO_ID: ${SCENARIO_ID}
      ENABLE_SEED_DATA: ${ENABLE_SEED_DATA}
      REQUEST_ID_HEADER: ${REQUEST_ID_HEADER}
      MAX_REQUEST_ID_LENGTH: ${MAX_REQUEST_ID_LENGTH}
      MAX_PAGE_SIZE: ${MAX_PAGE_SIZE}
      INCIDENT_SERVICE_URL: ${INCIDENT_SERVICE_URL}
      RESERVATION_TTL_SECONDS: ${RESERVATION_TTL_SECONDS}
    ports:
      - "${WORKFORCE_SERVICE_PORT}:${WORKFORCE_SERVICE_CONTAINER_PORT}"
    volumes:
      - workforce_data:/app/data
      - ./scenarios:/app/scenarios:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${SERVICE_PORT}/readiness"]
      interval: 5s
      timeout: 3s
      retries: 10

  communication-service:
    build:
      context: .
      dockerfile: tools/communication-service/Dockerfile
    container_name: optiflow-communication
    environment:
      SERVICE_NAME: communication-service
      SERVICE_PORT: ${COMMUNICATION_SERVICE_CONTAINER_PORT}
      ENVIRONMENT: ${APP_ENV}
      DATABASE_URL: ${COMMUNICATION_DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      TOOL_SHARED_TOKEN: ${TOOL_SHARED_TOKEN}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      SCENARIO_ID: ${SCENARIO_ID}
      ENABLE_SEED_DATA: ${ENABLE_SEED_DATA}
      REQUEST_ID_HEADER: ${REQUEST_ID_HEADER}
      MAX_REQUEST_ID_LENGTH: ${MAX_REQUEST_ID_LENGTH}
      MAX_PAGE_SIZE: ${MAX_PAGE_SIZE}
      INCIDENT_SERVICE_URL: ${INCIDENT_SERVICE_URL}
      WORKFORCE_SERVICE_URL: ${WORKFORCE_SERVICE_URL}
      ASSIGNMENT_REQUEST_TTL_SECONDS: ${ASSIGNMENT_REQUEST_TTL_SECONDS}
      DEMO_DEFAULT_ASSIGNMENT_RESPONSE: ${DEMO_DEFAULT_ASSIGNMENT_RESPONSE:-ACCEPTED}
      SIMULATED_DELIVERY_MODE: ${SIMULATED_DELIVERY_MODE}
    ports:
      - "${COMMUNICATION_SERVICE_PORT}:${COMMUNICATION_SERVICE_CONTAINER_PORT}"
    volumes:
      - communication_data:/app/data
      - ./scenarios:/app/scenarios:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${SERVICE_PORT}/readiness"]
      interval: 5s
      timeout: 3s
      retries: 10

  core-api:
    profiles: ["full-stack"]
    build:
      context: ./core-api
    container_name: optiflow-core
    environment:
      APP_ENV: ${APP_ENV}
      APP_VERSION: ${APP_VERSION}
      SERVICE_NAME: core-api
      SERVICE_PORT: ${CORE_API_CONTAINER_PORT}
      CORE_API_HOST: ${CORE_API_HOST}
      CORE_LOG_LEVEL: ${CORE_LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      CRM_SERVICE_URL: ${CRM_SERVICE_URL}
      INCIDENT_SERVICE_URL: ${INCIDENT_SERVICE_URL}
      WORKFORCE_SERVICE_URL: ${WORKFORCE_SERVICE_URL}
      COMMUNICATION_SERVICE_URL: ${COMMUNICATION_SERVICE_URL}
      TOOL_SHARED_TOKEN: ${TOOL_SHARED_TOKEN}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      LLM_SETTINGS_ENCRYPTION_KEY: ${LLM_SETTINGS_ENCRYPTION_KEY:-}
      OPTIMIZER_PROVIDER: ${OPTIMIZER_PROVIDER}
      CP_SAT_TIME_LIMIT_SECONDS: ${CP_SAT_TIME_LIMIT_SECONDS}
      CP_SAT_RANDOM_SEED: ${CP_SAT_RANDOM_SEED}
      GENERATE_ALL_OPTIMIZATION_PROFILES: ${GENERATE_ALL_OPTIMIZATION_PROFILES}
      OPTIMIZER_ALLOW_FALLBACK: ${OPTIMIZER_ALLOW_FALLBACK}
      COLD_START_RUNS: ${COLD_START_RUNS:-5}
      MATURE_LEARNING_RUNS: ${MATURE_LEARNING_RUNS:-20}
      PREFERENCE_CONFIDENCE_LOW_THRESHOLD: ${PREFERENCE_CONFIDENCE_LOW_THRESHOLD:-0.40}
      PREFERENCE_CONFIDENCE_HIGH_THRESHOLD: ${PREFERENCE_CONFIDENCE_HIGH_THRESHOLD:-0.70}
      PREFERENCE_PROFILE_WEIGHT: ${PREFERENCE_PROFILE_WEIGHT:-0.70}
      PREFERENCE_GOAL_SIMILARITY_WEIGHT: ${PREFERENCE_GOAL_SIMILARITY_WEIGHT:-0.30}
      PREFERENCE_DOMINANCE_FACTOR_WEIGHT: ${PREFERENCE_DOMINANCE_FACTOR_WEIGHT:-0.60}
      PREFERENCE_ACCEPTANCE_FACTOR_WEIGHT: ${PREFERENCE_ACCEPTANCE_FACTOR_WEIGHT:-0.40}
      DEMO_MODE: ${DEMO_MODE}
      DEMO_DELAY_MS: ${DEMO_DELAY_MS}
      DEMO_PORTFOLIO_TIMEOUT_SECONDS: ${DEMO_PORTFOLIO_TIMEOUT_SECONDS}
      DEMO_HEALTH_TIMEOUT_SECONDS: ${DEMO_HEALTH_TIMEOUT_SECONDS}
      DEMO_ALLOW_FAILURE_INJECTION: ${DEMO_ALLOW_FAILURE_INJECTION}
      SIMULATION_DEFAULT_SCENARIO: ${SIMULATION_DEFAULT_SCENARIO:-product_release_day}
      SIMULATION_AUTO_ADVANCE: ${SIMULATION_AUTO_ADVANCE:-false}
      SIMULATION_TIMEZONE: ${SIMULATION_TIMEZONE:-UTC}
      SIMULATION_EVENT_CALLBACK_URL: ${SIMULATION_EVENT_CALLBACK_URL:-}
      SIMULATION_EVENT_TIMEOUT_SECONDS: ${SIMULATION_EVENT_TIMEOUT_SECONDS:-3}
      SIMULATION_MAX_EVENT_RETRIES: ${SIMULATION_MAX_EVENT_RETRIES:-2}
      SIMULATION_SCENARIO_ROOT: ${SIMULATION_SCENARIO_ROOT:-scenarios}
      SAGA_POLL_MAX_ATTEMPTS: ${SAGA_POLL_MAX_ATTEMPTS}
      SAGA_POLL_INTERVAL_SECONDS: ${SAGA_POLL_INTERVAL_SECONDS}
    ports:
      - "${CORE_API_PORT}:${CORE_API_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${SERVICE_PORT}/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./shared/python/optiflow_shared:/app/optiflow_shared:ro
      - ./core-api/app:/app/app
      - ./core-api/scripts:/app/scripts:ro
      - ./scenarios:/app/scenarios:ro
    depends_on:
      postgres:
        condition: service_healthy
      crm-service:
        condition: service_healthy
      incident-service:
        condition: service_healthy
      workforce-service:
        condition: service_healthy
      communication-service:
        condition: service_healthy

  frontend:
    profiles: ["full-stack"]
    build:
      context: ./frontend
    container_name: optiflow-frontend
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_CONTAINER_PORT}"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${FRONTEND_CONTAINER_PORT}/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  crm_data:
  incident_data:
  workforce_data:
  communication_data:
