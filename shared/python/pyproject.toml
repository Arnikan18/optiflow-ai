[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optiflow-shared"
version = "0.1.0"
description = "Shared technical standards for OptiFlow Phase 2 services."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3.0",
    "starlette>=0.37,<1.0",
]

[tool.setuptools.packages.find]
include = ["optiflow_shared*"]
